<title>Deign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Marcellus&display=swap">
<style>
/* Layout: a single working surface. Board dominates on the left; turn controls, card inspector and log stack on the right. On phones everything stacks: status, controls, board, info. */
:root {
  --bg: #e8ebf1;
  --panel: #f5f6fa;
  --panel2: #dde2ea;
  --line: #c2c9d6;
  --fg: #161a23;
  --mute: #566073;
  --cell: #d3d9e3;
  --cell-line: #b7bfce;
  --me: #b24d17;
  --me-soft: #f0cbb2;
  --foe: #1f60b3;
  --foe-soft: #bcd3ee;
  --accent: #7d5f08;
  --accent-soft: #eadba8;
  --ok: #23804b;
  --bad: #b32a38;
  --t-apex: #6a47b8;
  --t-gold: #a07400;
  --t-silver: #657083;
  --t-bronze: #96552a;
  --on-solid: #ffffff;
  --font-display: "Marcellus", "Iowan Old Style", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117;
    --panel: #161a23;
    --panel2: #1e2330;
    --line: #2b3242;
    --fg: #e5e8ef;
    --mute: #98a2b5;
    --cell: #252935;
    --cell-line: #0f1218;
    --me: #f08a58;
    --me-soft: #5a3423;
    --foe: #6ba6f3;
    --foe-soft: #243a5c;
    --accent: #e2b955;
    --accent-soft: #4a3d17;
    --ok: #4cc47f;
    --bad: #f0707c;
    --t-apex: #a98ff0;
    --t-gold: #e0b43a;
    --t-silver: #aab4c6;
    --t-bronze: #d98a52;
    --on-solid: #10131a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117;
  --panel: #161a23;
  --panel2: #1e2330;
  --line: #2b3242;
  --fg: #e5e8ef;
  --mute: #98a2b5;
  --cell: #252935;
  --cell-line: #0f1218;
  --me: #f08a58;
  --me-soft: #5a3423;
  --foe: #6ba6f3;
  --foe-soft: #243a5c;
  --accent: #e2b955;
  --accent-soft: #4a3d17;
  --ok: #4cc47f;
  --bad: #f0707c;
  --t-apex: #a98ff0;
  --t-gold: #e0b43a;
  --t-silver: #aab4c6;
  --t-bronze: #d98a52;
  --on-solid: #10131a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
#app { max-width: 1240px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
.muted { color: var(--mute); }

/* Buttons */
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 600; line-height: 1.1; }
.btn:hover:not(:disabled) { border-color: var(--mute); }
.btn.primary { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Home */
.home { display: grid; gap: 28px; padding-top: 4vh; }
.mast { display: grid; gap: 10px; max-width: 640px; }
.mast h1 { font-size: clamp(54px, 11vw, 104px); line-height: .95; letter-spacing: .04em; }
.mast p { font-size: 17px; color: var(--mute); margin: 0; max-width: 54ch; }
.modes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); max-width: 860px; }
.mode { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 6px; min-width: 0; }
.mode:hover:not(:disabled) { border-color: var(--accent); }
.mode h3 { font-size: 22px; }
.mode span { color: var(--mute); font-size: 14px; }
.note { font-size: 13px; color: var(--mute); max-width: 70ch; }
details.rules { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; max-width: 860px; }
details.rules summary { cursor: pointer; font-weight: 600; }
details.rules ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; }

/* Setup */
.setup { display: grid; gap: 18px; }
.setup-top { display: flex; gap: 16px; justify-content: space-between; align-items: end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--mute); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.field input, .field select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; min-width: 0; }
.pools { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.pool { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.pool:hover { border-color: var(--mute); }
.pool[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pool h3 { font-size: 18px; }
.pool p { margin: 0; font-size: 12.5px; color: var(--mute); }
.pips { display: flex; gap: 4px; }
.pip { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; border: 1px solid currentColor; }
.t-apex { color: var(--t-apex); } .t-gold { color: var(--t-gold); } .t-silver { color: var(--t-silver); } .t-bronze { color: var(--t-bronze); } .t-rainbow { color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h3 { font-size: 19px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
.chip .dot { width: 8px; height: 8px; border-radius: 2px; background: currentColor; flex: none; }
.chip.on-board { border-color: var(--mute); }
.chip.gone { opacity: .45; text-decoration: line-through; }
.chip.lili { opacity: .45; font-style: italic; }
.chip.sel { border-color: var(--accent); }
button.chip:hover { border-color: var(--accent); }
.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .split { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
.cardbox { display: grid; gap: 6px; }
.cardbox h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.statline { font-family: var(--font-mono); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
.statline b { font-weight: 700; }
.statline .up { color: var(--ok); } .statline .dn { color: var(--bad); }
.cardbox p { margin: 0; font-size: 13.5px; }

/* Builder */
.catalog { display: grid; gap: 4px; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: var(--bg); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; }
.crow:hover { background: var(--panel2); }
.crow .nm { min-width: 0; overflow-wrap: anywhere; }
.crow .nm small { display: block; color: var(--mute); font-size: 12px; }
.qty { display: inline-flex; gap: 6px; align-items: center; }
.qty button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); font-weight: 700; padding: 0; }
.tierhead { position: sticky; top: 0; background: var(--bg); padding: 6px 8px 2px; z-index: 1; }

/* Lobby */
.code { font-family: var(--font-mono); font-size: clamp(36px, 8vw, 64px); letter-spacing: .25em; font-weight: 700; color: var(--accent); }

/* Game */
.game { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "ctrl" "board" "info"; }
@media (min-width: 980px) {
  .game { grid-template-columns: minmax(0, 1fr) 372px; grid-template-areas: "head head" "board ctrl" "board info"; align-items: start; }
}
.ghead { grid-area: head; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ghead h1 { font-size: 30px; letter-spacing: .06em; }
.who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.me { background: var(--me); } .sw.foe { background: var(--foe); }
.turnpill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); }
.turnpill.on { background: var(--accent); color: var(--on-solid); border-color: var(--accent); }
.gctrl { grid-area: ctrl; display: grid; gap: 12px; min-width: 0; }
.ginfo { grid-area: info; display: grid; gap: 12px; min-width: 0; }
.gboard { grid-area: board; min-width: 0; }
.banner { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.banner strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.banner.mine { border-color: var(--accent); }
.banner.over { border-color: var(--accent); background: var(--accent-soft); }
.boardwrap { container-type: inline-size; width: 100%; max-width: 800px; margin-inline: auto; }
.board { display: grid; gap: 2px; background: var(--cell-line); padding: 2px; border-radius: 10px; width: 100%; }
.cell { position: relative; background: var(--cell); border: 0; border-radius: 3px; padding: 0; min-width: 0; min-height: 0; display: grid; place-items: center; cursor: default; color: inherit; }
.cell.pm { background: var(--me-soft); box-shadow: inset 0 0 0 1px var(--me); }
.cell.pf { background: var(--foe-soft); box-shadow: inset 0 0 0 1px var(--foe); }
.cell.can { cursor: pointer; }
.cell.mv::after { content: ""; position: absolute; inset: 33%; border-radius: 50%; background: var(--ok); opacity: .9; pointer-events: none; }
.cell.anc::after { content: ""; position: absolute; inset: 40%; border-radius: 50%; background: var(--accent); opacity: .55; pointer-events: none; }
.cell.at { box-shadow: inset 0 0 0 2px var(--bad); }
.cell.pk { box-shadow: inset 0 0 0 2px var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.cell.plok { background: color-mix(in srgb, var(--ok) 38%, var(--cell)); box-shadow: inset 0 0 0 1px var(--ok); }
.cell.plbad { background: color-mix(in srgb, var(--bad) 32%, var(--cell)); box-shadow: inset 0 0 0 1px var(--bad); }
.cell.land::before { content: "▼"; position: absolute; top: 2%; left: 8%; font-size: max(7px, 1.6cqw); color: var(--accent); }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .cell.pk { animation: none; } }
.unit { width: 86%; height: 86%; border-radius: 22%; display: grid; align-content: center; justify-items: center; line-height: 1.05; color: var(--on-solid); font-weight: 700; pointer-events: none; }
.unit.me { background: var(--me); } .unit.foe { background: var(--foe); }
.unit.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.unit.font { border-radius: 40%; }
.unit b { font-size: max(7.5px, 1.95cqw); font-weight: 700; }
.unit i { font-style: normal; font-family: var(--font-mono); font-size: max(6px, 1.3cqw); opacity: .9; }
.unit i .up { text-decoration: underline; } .unit i .dn { text-decoration: line-through; }
.unit.tint-lili { box-shadow: 0 0 0 2px var(--t-apex); }
.unit.fog { background: repeating-linear-gradient(135deg, var(--foe) 0 5px, color-mix(in srgb, var(--foe) 70%, #fff) 5px 10px); }
.cell { overflow: visible; }
.wall { position: absolute; background: var(--fg); pointer-events: none; z-index: 3; border-radius: 1px; }
.po { position: absolute; inset: 0; border: 0 solid var(--me); border-radius: 3px; pointer-events: none; z-index: 2; }
.po.foe { border-color: var(--foe); }
.po.t { border-top-width: max(2px, .5cqw); } .po.r { border-right-width: max(2px, .5cqw); } .po.b { border-bottom-width: max(2px, .5cqw); } .po.l { border-left-width: max(2px, .5cqw); }
.wall.wR { right: -3px; top: 6%; bottom: 6%; width: 4px; }
.wall.wD { bottom: -3px; left: 6%; right: 6%; height: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mute); margin-top: 8px; justify-content: center; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

/* Dice and tokens */
.dice { display: flex; gap: 8px; flex-wrap: wrap; }
.die { background: var(--panel2); border: 2px solid currentColor; border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; justify-items: center; min-width: 64px; font-weight: 600; }
.die small { color: var(--mute); font-weight: 500; font-size: 11px; }
.die[aria-pressed="true"] { background: color-mix(in srgb, currentColor 22%, var(--panel2)); box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 40%, transparent); }
.die span { color: var(--fg); font-size: 13px; }
.toks { display: flex; gap: 8px; flex-wrap: wrap; }
.tok { background: var(--panel2); border: 2px solid currentColor; border-radius: 10px; padding: 8px 12px 8px 10px; display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
.tok span { color: var(--fg); }
.tok svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tok.spent { opacity: .35; border-style: dashed; }
.tok.reserved { box-shadow: 0 0 0 2px var(--accent); }
.tok:disabled { opacity: .9; cursor: default; }
.tok.spent:disabled { opacity: .35; }
.tok.sel { background: color-mix(in srgb, currentColor 22%, var(--panel2)); }
.shapes { display: flex; gap: 8px; flex-wrap: wrap; }
.shape { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 2px; align-content: center; }
.shape:hover { border-color: var(--mute); }
.shape[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.shape i { width: 11px; height: 11px; border-radius: 2px; background: var(--mute); display: block; }
.shape i.y { background: var(--accent); }
.shape i.e { background: transparent; }
.tip { font-size: 13px; color: var(--mute); margin: 0; }
.list { display: grid; gap: 6px; }
.pickrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.pickrow:hover { border-color: var(--accent); }
.pickrow small { color: var(--mute); display: block; font-size: 12px; }
.log { font-size: 13px; display: grid; gap: 3px; max-height: 260px; overflow: auto; }
.log div { color: var(--mute); }
.log div:first-child { color: var(--fg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.err { color: var(--bad); font-size: 13px; }
</style>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* DEIGN engine: pure rules + AI. Works in browser (window.Deign) and Node (module.exports). */
(function (root) {
'use strict';

// ============================================================ CONFIG (tune here)
const W = 13, H = 12;                       // board size (cols x rows)
const MAX_ROLL = 3, FIRST_TURN_ROLL = 2;
const TURN_CAP = 400;                       // draw if the game drags past this many turns
const TIER_ORDER = ['apex', 'gold', 'silver', 'bronze'];
const TIER_LABEL = { apex: 'Snow / Obsidian', gold: 'Gold', silver: 'Silver', bronze: 'Bronze' };
// D = Descension, M = Movement, A = Attack. The rules do not list the faces of each die, so these are placeholders.
const DICE_FACES = {
  apex:    ['D', 'M', 'M', 'A', 'A', 'A'],
  gold:    ['D', 'M', 'M', 'A', 'A', 'A'],
  silver:  ['D', 'M', 'M', 'M', 'A', 'A'],
  bronze:  ['D', 'D', 'M', 'M', 'A', 'A'],
  rainbow: ['D', 'D', 'M', 'M', 'A', 'A']
};
// Pathway (Descension) shapes, read from the attached diagram. Cells are [col,row]; the anchor is the yellow square the Acolyte lands on.
// Players may rotate or flip a shape, like a physical tile.
const PATH_SHAPES = [
  { name: '1', cells: [[0,0],[0,1],[1,1],[2,1],[2,2],[3,2]], anchor: [2,1] },
  { name: '2', cells: [[2,0],[0,1],[1,1],[2,1],[3,1],[3,2]], anchor: [2,1] },
  { name: '3', cells: [[1,0],[0,1],[1,1],[2,1],[2,2],[3,2]], anchor: [2,1] },
  { name: '4', cells: [[0,0],[0,1],[1,1],[2,1],[3,1],[3,2]], anchor: [2,1] },
  { name: '5', cells: [[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]], anchor: [2,1] }
];

// ============================================================ CARDS
const CARDS = {};
function C(id, name, tier, sub, st, abil, text, tags) {
  CARDS[id] = { id: id, name: name, tier: tier, sub: sub, stats: st, abil: abil || null, text: text || '', tags: tags || [] };
}
// ---- Snow / Obsidian
C('albie','Albie the Primordial Zoa','apex','Snow',[3,3,3],'albie','When descended, gain an effect for each Zoa Acolyte on the board (stacks): Ella: enemy Movement -1. Angus: enemy Attack -1. Lucas: attacks up to 3 squares away. Charlotte: immune to enemy Acolyte effects.');
C('seojun','Seo-Jun, Mutagenic Advancement','apex','Snow',[2,2,2],'seojun','While on the board, all Acolytes without an effect gain Attack and Defence equal to this Acolyte\'s Attack and Defence.');
C('andromeda','Andromeda, Unchained','apex','Obsidian',[3,5,5],'andromeda','While on the board, may attack as many squares away as there are Little Stars on the field (including across unbuilt ground).');
C('lilili','Lilili the Abomination','apex','Obsidian',[3,3,1],'lilili','Can attack and be attacked by both players\' Acolytes. When it destroys an Acolyte, that Acolyte\'s original Attack and Defence are added to its own. The victim goes to Lilili\'s Zone, not Elysium.');
C('heaven10','The 10th Heaven','apex','Snow',[1,2,2],'heaven10','When descended, if your Font has survived 3 battles, you win the game.');
C('heaven5','5th Heaven Above','apex','Snow',[0,1,1],'heaven5','While on the board, when another of your Acolytes is attacked, you may swap it with your Font, which is attacked instead.');
C('d20',"D20, Combat's Risk",'apex','Snow',[2,2,2],'d20','While on the board, if three Descension results are rolled at the start of your turn, you win.');
C('rose','Rose the Ruinous Requiem','apex','Snow',[3,1,1],'rose','Cannot attack. When your turn ends, destroy either player\'s Acolytes standing on the same Pathway as Rose.');
C('disObs','The Disaster, Wind, Storm and Flames','apex','Obsidian',[2,3,3],'disObs','When descended, destroy every enemy Acolyte on a straight line (row, column or diagonal) between this and another of your Disaster Acolytes.',['disaster']);
C('creator','The Unruly Creator','apex','Snow',[1,1,1],'creator','When descended, replace as many enemy Acolytes as possible with Acolytes from your own Elysium (the enemy keeps control of the replacements). Replaced Acolytes go to Elysium.');
C('abu','Abu, Charming the Corrupted','apex','Snow',[2,2,2],'abu','When descended, hatch all of your Egg Acolytes.');
C('basilisk','The Egg of the Lamia','apex','Obsidian',[0,0,0],'egg5','While on the board, at the end of the 3rd of your turns it hatches and gains 5/5/5 Movement, Attack and Defence.',['egg']);
C('emiliano','Emiliano, Null Imprint','apex','Obsidian',[3,4,4],'emiliano','While on the board, all Acolytes\' stat changes are reverted to their original Movement, Attack and Defence.');

function validatePool(cards) {
  if (cards.length !== 10) return 'A Pool needs exactly 10 Acolytes (has ' + cards.length + ').';
  const cnt = {};
  cards.forEach(function (c) { cnt[c] = (cnt[c] || 0) + 1; });
  for (const k in cnt) {
    const cd0 = CARDS[k]; if (!cd0) return 'Unknown card ' + k;
    if (cd0.tags.indexOf('star') >= 0) continue;
    const lim = cd0.tier === 'apex' ? 1 : 3;
    if (cnt[k] > lim) return cd0.name + ': at most ' + lim + ' allowed.';
  }
  return null;
}

// After a unit moves, Alara may fling it somewhere else on the Path.

  if (u.st !== 'board' || S.phase === 'over' || S.pending) return;

// ------------------------------------------------------------ GAME: highlights
function pickTok(type, unitId) {
  const ts = D.unspent(S).filter(function (t) { return t.type === type; });
  return (unitId ? ts.find(function (t) { return t.only === unitId; }) : null) || ts.find(function (t) { return !t.only; });
}
function validAnchors(f) { const m = {}; f.valid.forEach(function (p) { if (D.VARIANTS[p.vi].shape === f.shape) m[p.ay * W + p.ax] = 1; }); return m; }
function computeHL() {
  const h = { mv: {}, at: {}, pk: {}, pkPath: {}, pkCell: {}, plok: {}, plbad: {}, anc: {}, land: {} };
  if (!S || S.phase === 'over' || !myTurnNow()) return h;
  const P = S.pending;
  if (P) {
    if (P.kind === 'pickUnit') P.opts.forEach(function (id) { const u = S.aco[id]; if (u.st === 'board') h.pk[u.y * W + u.x] = id; });
    if (P.kind === 'pickPath') P.opts.forEach(function (pid) { S.paths[pid].cells.forEach(function (c) { h.pk[c[1] * W + c[0]] = pid; h.pkPath[c[1] * W + c[0]] = pid; }); });
    if (P.kind === 'pickCell') P.opts.forEach(function (c) { h.pk[c[1] * W + c[0]] = 'cell'; h.pkCell[c[1] * W + c[0]] = true; });
    if (P.cont === 'labSide' && P.cell) { h.pk[P.cell[1] * W + P.cell[0]] = 'cell'; }
  }
  if (UI.flow && UI.flow.stage === 'place') {
    const f = UI.flow; h.anc = validAnchors(f);
    if (f.anchor) {
      const ok = D.canPlace(S, me, f.vi, f.anchor[0], f.anchor[1], f.free);
      D.cellsOf(D.VARIANTS[f.vi], f.anchor[0], f.anchor[1]).forEach(function (c) { if (c[0] >= 0 && c[1] >= 0 && c[0] < W && c[1] < H) h[ok ? 'plok' : 'plbad'][c[1] * W + c[0]] = 1; });
      h.land[f.anchor[1] * W + f.anchor[0]] = 1;
    }
    return h;
  }
  if (UI.azr) {
    const u = S.aco[UI.azr.u], v = S.aco[UI.azr.id];
    D.azraelCells(S, u, v).forEach(function (c) { h.pk[c[1] * W + c[0]] = 'azr'; });
    return h;
  }
  if (!P && S.phase === 'act' && UI.selFont && D.fontLive(S, me)) {
    if (pickTok('M', null)) D.fontDests(S, me).forEach(function (d) { h.mv[d.y * W + d.x] = { font: true }; });
    if (pickTok('A', null)) D.fontTargets(S, me).forEach(function (t) {
      if (t.t === 'font') { const f = S.fonts[t.p]; h.at[f.y * W + f.x] = t; }
      else { const v = S.aco[t.id]; h.at[v.y * W + v.x] = t; }
    });
    return h;
  }
  if (!P && S.phase === 'act' && UI.sel) {
    const u = S.aco[UI.sel];
    if (u && u.st === 'board' && D.commandable(S, me, u)) {
      if (pickTok('M', u.id)) {
        D.moveDests(S, u).forEach(function (d) { h.mv[d.y * W + d.x] = {}; });
        D.fenrirRuns(S, u).forEach(function (r) { h.mv[r.y * W + r.x] = { dir: r.dir }; });
      }
      if (u.owner === me && pickTok('A', u.id)) {
        D.attackTargets(S, u).forEach(function (t) {
          if (t.t === 'font') { const f = S.fonts[t.p]; h.at[f.y * W + f.x] = t; }
          else { const v = S.aco[t.id]; h.at[v.y * W + v.x] = t; }
        });
      }
    }
  }
  return h;
}

// ------------------------------------------------------------ GAME: board
function renderBoard() {
  let h = '';
  for (let dy = 0; dy < H; dy++) for (let dx = 0; dx < W; dx++) {
    const x = me === 1 ? W - 1 - dx : dx, y = me === 1 ? H - 1 - dy : dy, key = y * W + x;
    const pid = S.cells[y][x];
    let cls = 'cell';
    if (pid) cls += S.paths[pid].owner === me ? ' pm' : ' pf';
    if (HL.plok[key]) cls += ' plok'; if (HL.plbad[key]) cls += ' plbad';
    if (HL.mv[key]) cls += ' mv'; if (HL.at[key]) cls += ' at';
    if (HL.pk[key]) cls += ' pk'; if (HL.anc[key]) cls += ' anc'; if (HL.land[key]) cls += ' land';
    if (HL.mv[key] || HL.at[key] || HL.pk[key] || HL.anc[key] || (UI.flow && UI.flow.stage === 'place')) cls += ' can';
    const u = D.unitAt(S, x, y), f = D.fontAt(S, x, y);
    let inner = '';
    if (pid) {
      // Outline each 6-square Pathway: draw an edge wherever the neighbouring square belongs to a different Pathway.
      const sg = me === 1 ? -1 : 1, nb = function (ox, oy) { const nx = x + ox * sg, ny = y + oy * sg; return (nx >= 0 && ny >= 0 && nx < W && ny < H) ? S.cells[ny][nx] : null; };
      let eg = '';
      if (nb(0, -1) !== pid) eg += ' t'; if (nb(1, 0) !== pid) eg += ' r'; if (nb(0, 1) !== pid) eg += ' b'; if (nb(-1, 0) !== pid) eg += ' l';
      inner += '<span class="po ' + (S.paths[pid].owner === me ? 'me' : 'foe') + eg + '"></span>';
    }
    if (u) {
      cls += ' can';
      const e = D.stat(S, u), b = cardOf(u).stats;
      const sv = function (v, base) { return v > base ? '<span class="up">' + fmt(v) + '</span>' : (v < base ? '<span class="dn">' + fmt(v) + '</span>' : fmt(v)); };
      if (u.owner !== me && D.fogged(S, u)) inner += '<span class="unit foe fog' + (UI.sel === u.id ? ' sel' : '') + '"><b>Fog</b><i>?/?/?</i></span>';
      else inner += '<span class="unit ' + (u.owner === me ? 'me' : 'foe') + (UI.sel === u.id ? ' sel' : '') + '"><b>' + esc(abbr(u.cid)) + '</b><i>' + sv(e.m, b[0]) + '/' + sv(e.a, b[1]) + '/' + sv(e.d, b[2]) + '</i></span>';
    } else if (f >= 0) {
      const fs = D.fontStat(S, f);
      if (f === me && S.phase === 'act' && (fs.m > 0 || fs.a > 0)) cls += ' can';
      inner += '<span class="unit font ' + (f === me ? 'me' : 'foe') + (UI.selFont && f === me ? ' sel' : '') + '"><b>F</b><i>' + fmt(fs.m) + '/' + fmt(fs.a) + '/' + fmt(fs.d) + '</i></span>';
    }
    // Labyrinth Maker walls: draw the wall on the right or lower edge of this square, as seen from this player's seat.
    const rx = me === 1 ? x - 1 : x + 1, ry = y, dx2 = x, dy2 = me === 1 ? y - 1 : y + 1;
    if (D.wallBlocks(S, x, y, rx, ry)) inner += '<span class="wall wR"></span>';
    if (D.wallBlocks(S, x, y, dx2, dy2)) inner += '<span class="wall wD"></span>';
    h += '<button class="' + cls + '" data-act="cell" data-x="' + x + '" data-y="' + y + '" aria-label="Square ' + (x + 1) + ',' + (y + 1) + '">' + inner + '</button>';
  }
  return '<div class="boardwrap"><div class="board" style="grid-template-columns:repeat(' + W + ',minmax(0,1fr));grid-template-rows:repeat(' + H + ',minmax(0,1fr));aspect-ratio:' + W + ' / ' + H + '">' + h + '</div><div class="legend"><span style="--c:var(--me)">You</span><span style="--c:var(--foe)">Opponent</span><span style="--c:var(--ok)">Can move here</span><span style="--c:var(--bad)">Can attack</span><span style="--c:var(--fg)">Outline = one 6-square Pathway</span></div></div>';
}

// ------------------------------------------------------------ GAME: controls
function tokHtml(t, opts) {

}
function statusBanner() {

}
function freeBtns() {

function controlsHtml() {

      dice.map(function (id) {

        return '<button class="die t-' + k + '" data-act="toggleDie" data-id="' + id + '" aria-pressed="' + (UI.rollSel.indexOf(id) >= 0) + '"><span>' + esc(abbr(a.cid)) + '</span><small>' + TIER_NAME[k] + '</small></button>';
      }).join('') + '</div><div class="row"><button class="btn primary" data-act="roll" ' + (UI.rollSel.length ? '' : 'disabled') + '>Roll ' + UI.rollSel.length + ' ' + (UI.rollSel.length === 1 ? 'die' : 'dice') + '</button></div>' + freeBtns() + '</div>';
  }

  ['M', 'A'].forEach(function (ty) {

  let rer = '';

// ------------------------------------------------------------ AI
function schedAI() {

  if (actorNow() === me) return;
  aiTimer = setTimeout(function () {
    if (!S || mode !== 'ai' || S.phase === 'over' || actorNow() === me) return;
    try {
      const a = D.aiNext(S);
      const r = D.apply(S, a);

    } catch (e) { console.error(e); try { D.apply(S, { t: 'end' }); } catch (e2) {} }

// ------------------------------------------------------------ online
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  try {
    let code = '', ref = null;
    for (let i = 0; i < 6; i++) { code = genCode(); ref = dbApi.doc('rooms/' + code); const s = await ref.get(); if (!s.exists) break; ref = null; }
    if (!ref) throw new Error('Could not find a free room code. Try again.');
    await ref.set({ status: 'lobby', created: Date.now(), seat0: { uid: uid, name: myName.trim() || 'Player 1', pool: myPool }, seat1: null, state: null, ver: 0 });
    enterRoom(code, 0);

}

}

  me = seat; mode = 'online'; view = 'lobby'; S = null;

      await net.ref.update({ state: JSON.stringify(S), ver: ver, phase: S.phase });
    } while (net.again);
  } catch (e) { toast('Could not send your move: ' + (e && e.code || 'error')); }
  net.writing = false;
}

// ------------------------------------------------------------ events
document.addEventListener('click', function (ev) {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'home': toHome(); break;
    case 'goSetup': setupMode = el.dataset.mode; setupErr = ''; builder.open = false; view = 'setup'; render(); break;
    case 'pickPool': { const i = Number(el.dataset.i); myPool = poolFromPreset(i); builder.open = false; UI.poolView = null; render(); break; }
    case 'poolInspect': UI.poolView = el.dataset.cid; render(); break;
    case 'openBuilder': {
      builder.open = true; builder.q = ''; builder.counts = {}; myPool.cards.forEach(function (c) { builder.counts[c] = (builder.counts[c] || 0) + 1; }); builder.rainbow = -1; render(); break;
    }
    case 'closeBuilder': builder.open = false; render(); break;
    case 'bqty': {
      const k = el.dataset.id, d = Number(el.dataset.d); builder.counts[k] = Math.max(0, (builder.counts[k] || 0) + d); if (!builder.counts[k]) delete builder.counts[k]; builder.rainbow = -1; render(); break;
    }
    case 'useBuilder': {
      const cards = []; Object.keys(builder.counts).forEach(function (k) { for (let i = 0; i < builder.counts[k]; i++) cards.push(k); });
      if (D.validatePool(cards)) break;
      cards.sort(function (a, b) { return D.TIER_ORDER.indexOf(D.CARDS[a].tier) - D.TIER_ORDER.indexOf(D.CARDS[b].tier); });
      myPool = { cards: cards, rainbow: builder.rainbow >= 0 && builder.rainbow < cards.length ? builder.rainbow : -1, label: 'Custom' };
      builder.open = false; UI.poolView = null; render(); break;
    }
    case 'startAI': startAI(); break;
    case 'createRoom': createRoom(); break;
    case 'joinRoom': joinRoom(); break;
    case 'rejoin': joinRoom(el.dataset.code); break;
    case 'forgetRoom': store.del('deign.room'); render(); break;
    case 'copyCode':
      try { navigator.clipboard.writeText(net.code).then(function () { toast('Code copied.'); }, function () { toast('Select the code and copy it by hand.'); }); } catch (e) { toast('Select the code and copy it by hand.'); }
      break;
    case 'leaveRoom': store.del('deign.room'); toHome(); break;
    case 'leaveGame': store.del('deign.room'); toHome(); break;
    case 'again': if (UI.lastSetup) { begin(D.newGame({ names: UI.lastSetup.names, pools: UI.lastSetup.pools, ai: [false, true], first: Math.random() < 0.5 ? 0 : 1 }), 0, 'ai'); } break;
    case 'cell': onCell(Number(el.dataset.x), Number(el.dataset.y)); break;
    case 'inspect': { const u = S.aco[id]; UI.insp = u.owner !== me && D.fogged(S, u) ? { fog: true } : { cid: u.cid, aid: id }; render(); break; }
    case 'toggleDie': {
      const i = UI.rollSel.indexOf(id);
      if (i >= 0) UI.rollSel.splice(i, 1); else if (UI.rollSel.length < D.rollLimit(S)) UI.rollSel.push(id); else toast('You can roll at most ' + D.rollLimit(S) + ' dice.');
      render(); break;
    }
    case 'roll': act({ t: 'roll', dice: UI.rollSel.slice() }); break;
    case 'endTurn': UI.sel = null; UI.flow = null; act({ t: 'end' }); break;
    case 'reroll': act({ t: 'reroll', tok: id }); break;
    case 'tokD': {
      const t = D.tokById(S, id);
      UI.flow = { kind: 'descend', tok: id, stage: 'pick', opts: D.descendOptions(S, me, t) };
      UI.sel = null; render(); break;
    }
    case 'sac': {
      const ty = el.dataset.type, pair = D.unspent(S).filter(function (t) { return t.type === ty; }).slice(0, 2);
      const opts = S.pl[me].acos.filter(function (q) { return S.aco[q].st === 'pool' && cardOf(S.aco[q]).tier === 'bronze'; });
      UI.flow = { kind: 'sac', toks: [pair[0].id, pair[1].id], stage: 'pick', opts: opts };
      UI.sel = null; render(); break;
    }
    case 'god': {
      const ty = el.dataset.type, tr = D.unspent(S).filter(function (t) { return t.type === ty; }).slice(0, 3);
      const opts = S.pl[me].acos.filter(function (q) { return S.aco[q].st === 'pool' && D.descendOptions(S, me, { any: true }).indexOf(q) >= 0; });
      UI.flow = { kind: 'god', toks: tr.map(function (t) { return t.id; }), stage: 'pick', opts: opts };
      UI.sel = null; render(); break;
    }
    case 'pickAco': {
      const f = UI.flow; f.aco = id;
      if (!startFlow(f.kind, { tok: f.tok, toks: f.toks, aco: id })) { UI.flow = null; }
      render(); break;
    }
    case 'cancelFlow': UI.flow = null; render(); break;
    case 'pickShape': setShape(Number(el.dataset.i)); break;
    case 'rotate': rotateFlow(); break;
    case 'confirmFlow': confirmFlow(); break;
    case 'skipPending': act({ t: 'resolve', choice: { skip: true } }); break;
    case 'pickEly': act({ t: 'resolve', choice: { id: id } }); break;
    case 'react': act({ t: 'resolve', choice: { yes: el.dataset.yes === '1' } }); break;
    case 'pickOpt': act({ t: 'resolve', choice: { v: el.dataset.v } }); break;
    case 'toggleCombo': UI.combo = !UI.combo; render(); break;
    case 'free': { const fa = D.freeActions(S, me)[Number(el.dataset.i)]; if (fa) { UI.sel = null; act(fa); } break; }
    case 'resign': UI.confirmResign = true; render(); break;
    case 'resignNo': UI.confirmResign = false; render(); break;
    case 'resignYes': UI.confirmResign = false; act({ t: 'resign', p: me }); break;
  }
});
document.addEventListener('input', function (ev) {
  const t = ev.target;
  if (t.dataset.input === 'name') { myName = t.value; store.set('deign.name', myName); }
  if (t.dataset.input === 'code') { joinCode = t.value.toUpperCase(); }
  if (t.dataset.input === 'bsearch') { builder.q = t.value; render(); }
});
document.addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.dataset.change === 'opp') { oppChoice = t.value; }
  if (t.dataset.change === 'rainbow') { builder.rainbow = Number(t.value); }
});
document.addEventListener('keydown', function (ev) {
  if (view !== 'game' || !UI.flow) return;
  if (ev.target && ev.target.tagName === 'INPUT') return;
  if (ev.key === 'r' || ev.key === 'R') rotateFlow();
  if (ev.key === 'Escape' && UI.flow.kind !== 'yanPlace') { UI.flow = null; render(); }
});

window.__deign = { get S() { return S; }, D: D, UI: UI, act: act, onCell: onCell, begin: begin, render: render };
render();

// Presents Firebase Realtime Database through the small doc()/get()/set()/update()/onSnapshot() surface the lobby code uses.
function fbAdapter(fb) {
  const db = fb.database();
  const wrap = function (s) { return { exists: s.exists(), data: function () { return s.val(); } }; };
  return {
    doc: function (path) {
      const ref = db.ref(path);
      return {
        get: function () { return ref.get().then(wrap); },
        set: function (d) { return ref.set(d); },
        update: function (d) { return ref.update(d); },
        onSnapshot: function (cb, err) {
          const h = ref.on('value', function (s) { cb(wrap(s)); }, function (e) { if (err) err({ code: e && e.code || 'error' }); });
          return function () { ref.off('value', h); };
        }
      };
    }
  };
}
